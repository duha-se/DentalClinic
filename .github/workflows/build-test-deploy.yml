name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
# 1️⃣ Tests
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dental_clinic_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend deps
        run: npm install
        working-directory: BE

      - name: Run tests
        run: npm test
        working-directory: BE
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: dental_clinic_test
          JWT_SECRET: testsecret

# 2️⃣ Build + Scan + Push
  build-scan-push:
    name: Build, Scan & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # ---- Backend ----
      - name: Build backend image
        run: |
          docker build -t ghcr.io/${{ github.actor }}/dentalclinic-backend:latest ./BE
          docker tag ghcr.io/${{ github.actor }}/dentalclinic-backend:latest \
                     ghcr.io/${{ github.actor }}/dentalclinic-backend:${{ github.sha }}

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.actor }}/dentalclinic-backend:latest
          severity: CRITICAL
          exit-code: 1

      - name: Push backend image
        run: |
          docker push ghcr.io/${{ github.actor }}/dentalclinic-backend:latest
          docker push ghcr.io/${{ github.actor }}/dentalclinic-backend:${{ github.sha }}

      # ---- Frontend ----
      - name: Build frontend image
        run: |
          docker build -t ghcr.io/${{ github.actor }}/dentalclinic-frontend:latest ./FE
          docker tag ghcr.io/${{ github.actor }}/dentalclinic-frontend:latest \
                     ghcr.io/${{ github.actor }}/dentalclinic-frontend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push ghcr.io/${{ github.actor }}/dentalclinic-frontend:latest
          docker push ghcr.io/${{ github.actor }}/dentalclinic-frontend:${{ github.sha }}
# 3️⃣ Deploy to EKS
  deploy:
    name: Deploy to Kubernetes (EKS)
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-west-2 \
            --name my-eks-cluster

      - name: Deploy manifests to EKS
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/dentalclinic-backend -n k8s-duha