name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
# 1️⃣ Tests
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: ghcr.io/mysql/mysql-server:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dental_clinic_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend deps
        run: npm install
        working-directory: BE

      - name: Run tests
        run: npm test
        working-directory: BE
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: dental_clinic_test
          JWT_SECRET: testsecret

# 2️⃣ Build + Scan + Push
  build-scan-push:
    name: Build, Scan & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # ---- Backend ----
      - name: Build backend image
        run: |
          docker build -t ghcr.io/${{ github.actor }}/dentalclinic-backend:latest ./BE
          docker tag ghcr.io/${{ github.actor }}/dentalclinic-backend:latest \
                     ghcr.io/${{ github.actor }}/dentalclinic-backend:${{ github.sha }}

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.actor }}/dentalclinic-backend:latest
          severity: CRITICAL
          exit-code: 1

      - name: Push backend image
        run: |
          docker push ghcr.io/${{ github.actor }}/dentalclinic-backend:latest
          docker push ghcr.io/${{ github.actor }}/dentalclinic-backend:${{ github.sha }}

      # ---- Frontend ----
      - name: Build frontend image
        run: |
          docker build -t ghcr.io/${{ github.actor }}/dentalclinic-frontend:latest ./FE
          docker tag ghcr.io/${{ github.actor }}/dentalclinic-frontend:latest \
                     ghcr.io/${{ github.actor }}/dentalclinic-frontend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push ghcr.io/${{ github.actor }}/dentalclinic-frontend:latest
          docker push ghcr.io/${{ github.actor }}/dentalclinic-frontend:${{ github.sha }}