name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checkout-setup:
    name: Checkout & Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    needs: checkout-setup

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dental_clinic_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm install
        working-directory: BE

      - name: Run backend tests
        run: npm test
        working-directory: BE
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: dental_clinic_test
          JWT_SECRET: testsecret

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build backend image
        run: |
          docker build -t ghcr.io/${{ github.actor }}/dentalclinic-backend:latest ./BE
          docker tag ghcr.io/${{ github.actor }}/dentalclinic-backend:latest ghcr.io/${{ github.actor }}/dentalclinic-backend:${{ github.sha }}

      - name: Build frontend image
        run: |
          docker build -t ghcr.io/${{ github.actor }}/dentalclinic-frontend:latest ./FE
          docker tag ghcr.io/${{ github.actor }}/dentalclinic-frontend:latest ghcr.io/${{ github.actor }}/dentalclinic-frontend:${{ github.sha }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run Trivy scan (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.actor }}/dentalclinic-backend:latest
          severity: CRITICAL
          exit-code: 1

      - name: Run npm audit (backend)
        run: npm audit --audit-level=high
        working-directory: BE

  push:
    name: Push Images to GHCR
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Push backend image
        run: |
          docker push ghcr.io/${{ github.actor }}/dentalclinic-backend:latest
          docker push ghcr.io/${{ github.actor }}/dentalclinic-backend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push ghcr.io/${{ github.actor }}/dentalclinic-frontend:latest
          docker push ghcr.io/${{ github.actor }}/dentalclinic-frontend:${{ github.sha }}

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.27.0

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/dentalclinic-backend

      - name: Show deployed app info
        run: kubectl get all