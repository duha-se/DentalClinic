services:
  db:
    image: mysql:8
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dental_clinic
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./BE
    ports:
      - "5001:5001"
    env_file:
      - ./BE/.env
    depends_on:
      - db

  frontend:
    build: ./FE
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
